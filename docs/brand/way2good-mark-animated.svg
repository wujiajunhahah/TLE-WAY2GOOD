<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="way2good">
  <title>way2good</title>
  <clipPath id="w2g-above"><rect x="0" y="0" width="64" height="49.5"/></clipPath>
  <!-- the way draws itself first -->
  <path d="M5 52 L59 52" fill="none" stroke="#E8912F" stroke-width="5.0" stroke-linecap="round"
        stroke-dasharray="54" stroke-dashoffset="54">
    <animate attributeName="stroke-dashoffset" from="54" to="0" begin="0s" dur="0.5s"
             fill="freeze" calcMode="spline" keySplines="0.25 0.7 0.3 1" keyTimes="0;1"/>
  </path>
  <!-- then the cat comes up from behind it, with a small settle at the top -->
  <g clip-path="url(#w2g-above)">
    <g>
      <animateTransform attributeName="transform" type="translate" begin="0.42s" dur="0.86s"
        fill="freeze" calcMode="spline" keyTimes="0;0.6;0.79;1"
        keySplines="0.2 0.7 0.3 1;0.4 0 0.7 1;0.3 0 0.5 1"
        values="0 15;0 0;0 2.6;0 0"/>
      <path d="M15.5 46.5 C16.8 39.5 19.4 34.6 22.2 31.6 L25.2 23.4 L30.6 30.9 C31.3 30.6 32.7 30.6 33.4 30.9 L38.8 23.4 L41.8 31.6 C44.6 34.6 47.2 39.5 48.5 46.5" fill="none" stroke="#2A1C12" stroke-width="4.8"
            stroke-linecap="round" stroke-linejoin="round" opacity="1">
        <animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.12s" fill="freeze"/>
      </path>
    </g>
  </g>
</svg>
